services:
  abridgerr:
    image: ghcr.io/abridgerr/abridgerr:latest
    # or build it yourself instead of pulling:
    # build: .
    container_name: abridgerr
    restart: unless-stopped
    volumes:
      - ./config:/config
      - /path/to/your/media:/mnt/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=http://sonarr:8989
      - SONARR_API_KEY=${SONARR_API_KEY}
    devices:
      - /dev/dri:/dev/dri  # optional: Intel QSV/VAAPI passthrough
